name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @outcomeos/web check
      - run: pnpm --filter @outcomeos/web build
        env:
          DEMO_AUTH_ENABLED: "false"
          MOCK_INTEGRATIONS_ENABLED: "false"
      - run: pnpm --filter @outcomeos/web exec playwright install --with-deps chromium
      - run: pnpm --filter @outcomeos/web test:e2e
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: outcomeos_test
          POSTGRES_USER: outcomeos
          POSTGRES_PASSWORD: outcomeos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outcomeos -d outcomeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql+psycopg://outcomeos:outcomeos@localhost:5432/outcomeos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff check apps/api scripts/validate_migrations.py
      - run: uv run --project apps/api ruff format --check apps/api scripts/validate_migrations.py
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests
      - run: make test
      - run: make test-integration
      - run: uv run --project apps/api python scripts/validate_migrations.py
      - run: uv build --project apps/api
      - name: Secret scanning
        run: uv run --project apps/api detect-secrets scan --all-files --exclude-files 'pnpm-lock.yaml' > /tmp/secrets.json && test "$(python -c 'import json; print(len(json.load(open("/tmp/secrets.json"))["results"]))')" = 0
      - run: git diff --check
