name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=outcomeos --cov-report=term-missing --cov-fail-under=90
      - run: python scripts/validate_migrations.py
      - name: Secret scanning
        run: detect-secrets scan --all-files --exclude-files 'package-lock.json' > /tmp/secrets.json && test "$(python -c 'import json; print(len(json.load(open("/tmp/secrets.json"))["results"]))')" = 0
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
