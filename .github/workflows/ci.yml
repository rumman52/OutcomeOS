name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - run: pnpm --filter @outcomeos/web lint
      - run: pnpm --filter @outcomeos/web typecheck
      - run: make test-web
      - run: pnpm --filter @outcomeos/web build
        env:
          DEMO_AUTH_ENABLED: "false"
          MOCK_INTEGRATIONS_ENABLED: "false"
      - run: pnpm --filter @outcomeos/web exec playwright install --with-deps chromium
      - run: pnpm --filter @outcomeos/web test:e2e
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: outcomeos_test
          POSTGRES_USER: outcomeos
          POSTGRES_PASSWORD: outcomeos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outcomeos -d outcomeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: outcomeos_ci
          MINIO_ROOT_PASSWORD: outcomeos-ci-only-secret # pragma: allowlist secret
          MINIO_DEFAULT_BUCKETS: outcomeos-ci
        ports: ["127.0.0.1:9000:9000"]
    env:
      INTEGRATION_DATABASE_URL: postgresql+psycopg://outcomeos:outcomeos@localhost:5432/outcomeos_test
      INTEGRATION_S3_ENDPOINT_URL: http://127.0.0.1:9000
      INTEGRATION_S3_ACCESS_KEY_ID: outcomeos_ci
      INTEGRATION_S3_SECRET_ACCESS_KEY: outcomeos-ci-only-secret # pragma: allowlist secret
      INTEGRATION_S3_BUCKET: outcomeos-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff check apps/api scripts/check_secret_scan.py scripts/validate_migrations.py
      - run: uv run --project apps/api ruff format --check apps/api scripts/check_secret_scan.py scripts/validate_migrations.py
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests
      - run: make test-api
      - run: make test-integration
      - name: Assert mandatory integration tests have zero skips
        run: uv run --project apps/api pytest apps/api/tests/integration -m integration --junitxml=/tmp/integration.xml && ! grep -q 'skipped="[1-9]' /tmp/integration.xml
      - run: uv run --project apps/api python scripts/validate_migrations.py
      - run: uv build --project apps/api
      - name: Secret scanning
        shell: bash
        run: |
          set -o pipefail
          cp .secrets.baseline /tmp/secrets.json
          git ls-files -z -- ':!pnpm-lock.yaml' |
            xargs -0 uv run --project apps/api detect-secrets scan --baseline /tmp/secrets.json --exclude-files '^\.secrets\.baseline$'
          uv run --project apps/api python scripts/check_secret_scan.py .secrets.baseline /tmp/secrets.json
      - run: git diff --check
