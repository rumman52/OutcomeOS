version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "outcomeos-worker"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "pydantic-settings" },
    { name = "psycopg", extra = ["binary"] },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "pydantic-settings", specifier = ">=2.10.1,<3" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2.9,<4" },
]

[package.metadata.requires-dev]
dev = [
    { name = "mypy", specifier = ">=1.17.1,<2" },
    { name = "pytest", specifier = ">=8.4.1,<9" },
    { name = "ruff", specifier = ">=0.12.8,<0.13" },
]

[[package]]
name = "pydantic-settings"
version = "2.10.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "psycopg"
version = "3.2.9"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "mypy"
version = "1.17.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.4.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.12.8"
source = { registry = "https://pypi.org/simple" }
