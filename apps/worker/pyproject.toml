[project]
name = "outcomeos-worker"
version = "0.1.0"
description = "OutcomeOS background worker"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.10.1,<3",
  "psycopg[binary]>=3.2.9,<4",
]

[dependency-groups]
dev = [
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.8,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outcomeos_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
