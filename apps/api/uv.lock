version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "outcomeos-api"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "alembic" },
    { name = "fastapi" },
    { name = "pydantic-settings" },
    { name = "psycopg", extra = ["binary"] },
    { name = "uvicorn", extra = ["standard"] },
]

[package.dev-dependencies]
dev = [
    { name = "httpx" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.16.4,<2" },
    { name = "fastapi", specifier = ">=0.116.1,<0.117" },
    { name = "pydantic-settings", specifier = ">=2.10.1,<3" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2.9,<4" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.35.0,<0.36" },
]

[package.metadata.requires-dev]
dev = [
    { name = "httpx", specifier = ">=0.28.1,<0.29" },
    { name = "mypy", specifier = ">=1.17.1,<2" },
    { name = "pytest", specifier = ">=8.4.1,<9" },
    { name = "ruff", specifier = ">=0.12.8,<0.13" },
]

[[package]]
name = "alembic"
version = "1.16.4"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "fastapi"
version = "0.116.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic-settings"
version = "2.10.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "psycopg"
version = "3.2.9"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "uvicorn"
version = "0.35.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "httpx"
version = "0.28.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "mypy"
version = "1.17.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.4.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.12.8"
source = { registry = "https://pypi.org/simple" }
