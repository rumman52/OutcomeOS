[project]
name = "outcomeos-api"
version = "0.1.0"
description = "OutcomeOS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1,<0.117",
  "pydantic-settings>=2.10.1,<3",
  "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.8,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outcomeos_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
