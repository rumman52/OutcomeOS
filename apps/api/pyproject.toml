[project]
name = "outcomeos-api"
version = "0.1.0"
description = "OutcomeOS API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.116.1,<0.117",
  "pgvector>=0.4,<0.5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10.1,<3",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "detect-secrets>=1.5,<2",
  "ruff>=0.12.8,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outcomeos_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires a disposable PostgreSQL database",
]
